<div class="form-grid">
  <label>Company name (full legal name) <span class="required">*</span><input name="name" required maxlength="300" value="{{ company.name if company else '' }}" placeholder="e.g. Fertilizantes Heringer S.A."></label>
  <label>Company name (short)<input name="short_name" maxlength="300" value="{{ company.short_name if company else '' }}" placeholder="e.g. Heringer"></label>
  <label class="full">Reviewed company aliases / local-language names<textarea name="aliases" maxlength="1500" rows="3" placeholder="One name per line; up to 8 names">{{ company.aliases if company else '' }}</textarea><small>Use names of this legal entity, not owners, subsidiaries or product brands. Put the preferred news name first. News APIs use the first alias of at least six letters/digits; Google searches the legal name and up to two aliases. Short names need country or industry evidence in the headline.</small></label>
  <label class="full">Alias sources and review notes<textarea name="alias_notes" maxlength="5000" rows="3" placeholder="Source URLs, review date and identity caveats">{{ company.alias_notes if company else '' }}</textarea><small>Changes apply to future searches. Earlier searches retain their saved company names.</small></label>
  <label>Country of registration <span class="required">*</span><input name="country_registration" list="registration-countries" required maxlength="150" value="{{ company.country_registration if company else '' }}" placeholder="Start typing a country" autocomplete="off"><datalist id="registration-countries">{% for country in country_names %}<option value="{{ country }}"></option>{% endfor %}</datalist></label>
  <label>Registration number<input name="registration_number" maxlength="150" value="{{ company.registration_number if company else '' }}" placeholder="Company or trade register number"></label>
  <label>Tax ID<input name="tax_id" maxlength="150" value="{{ company.tax_id if company else '' }}" placeholder="Taxpayer or VAT identifier"></label>
  <label>Key owners / shareholders<input name="key_owners" maxlength="1500" value="{{ company.key_owners if company else '' }}" placeholder="Names separated by commas"></label>
  <label>Top management<input name="top_management" maxlength="1500" value="{{ company.top_management if company else '' }}" placeholder="Names and roles"></label>
  <label>Primary countries of presence<input name="primary_countries" maxlength="1500" value="{{ company.primary_countries if company else '' }}" placeholder="Countries separated by commas"></label>
  <label>Affiliated / parent / subsidiary companies<input name="affiliates" maxlength="1500" value="{{ company.affiliates if company else '' }}" placeholder="Names separated by commas"></label>
  <label>Primary industries<input name="primary_industries" maxlength="1500" value="{{ company.primary_industries if company else '' }}" placeholder="Industries separated by commas"></label>
  <label class="full">Legal address<textarea name="legal_address" maxlength="1500" rows="2" placeholder="Registered legal address">{{ company.legal_address if company else '' }}</textarea></label>
  <label class="full">Comment<textarea name="comment" maxlength="5000" rows="3" placeholder="Other identifiers, context, or search hints">{{ company.comment if company else '' }}</textarea></label>
</div>
