<div class="form-grid">
  <label>{{ _('Company name (full legal name)') }} <span class="required">*</span><input name="name" required maxlength="300" value="{{ company.name if company else '' }}" placeholder="{{ _('e.g. Fertilizantes Heringer S.A.') }}"></label>
  <label>{{ _('Company name (short)') }}<input name="short_name" maxlength="300" value="{{ company.short_name if company else '' }}" placeholder="{{ _('e.g. Heringer') }}"></label>
  {% set names = (company.aliases if company else '')|parse_aliases %}
  <label class="full">{{ _('Reviewed company aliases / local-language names') }}<textarea name="aliases" maxlength="1500" rows="{{ [3, names|length]|max }}" placeholder="{{ _('One company alias per line') }}">{{ names|join('\n') }}</textarea><small>{{ _('Use names of this legal entity, not owners, subsidiaries or product brands. Enter up to 8 names, one per line. Pasted semicolons become line breaks when saved. Commas remain part of a name. Put the preferred news name first. News APIs search alternative aliases, the short name and legal name, then page through results within request limits. Enforcement searches use all reviewed aliases. Short names need country or industry evidence in the headline.') }}</small></label>
  <label class="full">{{ _('Alias sources and review notes') }}<textarea name="alias_notes" maxlength="5000" rows="3" placeholder="{{ _('Source URLs, review date and identity caveats') }}">{{ company.alias_notes if company else '' }}</textarea><small>{{ _('Changes apply to future searches. Earlier searches retain their saved company names.') }}</small></label>
  <label>{{ _('Country of registration') }} <span class="required">*</span><input name="country_registration" list="registration-countries" required maxlength="150" value="{{ company.country_registration if company else '' }}" placeholder="{{ _('Start typing a country') }}" autocomplete="off"><datalist id="registration-countries">{% for country in country_names %}<option value="{{ _(country) }}"></option>{% endfor %}</datalist></label>
  <label>{{ _('Registration number') }}<input name="registration_number" maxlength="150" value="{{ company.registration_number if company else '' }}" placeholder="{{ _('Company or trade register number') }}"></label>
  <label>{{ _('Tax ID') }}<input name="tax_id" maxlength="150" value="{{ company.tax_id if company else '' }}" placeholder="{{ _('Taxpayer or VAT identifier') }}"></label>
  <label>{{ _('Key owners / shareholders') }}<input name="key_owners" maxlength="1500" value="{{ company.key_owners if company else '' }}" placeholder="{{ _('Separate names with a semicolon (;)') }}"></label>
  <label>{{ _('Top management') }}<input name="top_management" maxlength="1500" value="{{ company.top_management if company else '' }}" placeholder="{{ _('Name (role); Name (role)') }}"></label>
  <label>{{ _('Primary countries of presence') }}<input name="primary_countries" maxlength="1500" value="{{ company.primary_countries if company else '' }}" placeholder="{{ _('Separate countries with a semicolon (;)') }}"></label>
  <label>{{ _('Affiliated / parent / subsidiary companies') }}<input name="affiliates" maxlength="1500" value="{{ company.affiliates if company else '' }}" placeholder="{{ _('Separate names with a semicolon (;)') }}"></label>
  <label>{{ _('Primary industries') }}<input name="primary_industries" maxlength="1500" value="{{ company.primary_industries if company else '' }}" placeholder="{{ _('Separate industries with a semicolon (;)') }}"></label>
  <label class="full">{{ _('Legal address') }}<textarea name="legal_address" maxlength="1500" rows="2" placeholder="{{ _('Registered legal address') }}">{{ company.legal_address if company else '' }}</textarea></label>
  <label class="full">{{ _('Comment') }}<textarea name="comment" maxlength="5000" rows="3" placeholder="{{ _('Other identifiers, context, or search hints') }}">{{ company.comment if company else '' }}</textarea></label>
</div>
